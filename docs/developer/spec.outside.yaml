id: SPEC-outside-001
title: outside のテスト仕様
design: DSG-outside-001
status: draft

note: >
  観点は 要件ごとに 確かめる振る舞い・渡す入力・ mock にする物 を書く。
  この部品の real の test だけが 実物 (実の時計・実の file・実の git) を触る。その時も
  test が自分で作った物だけを触り 機体に元から在る物を読まない。
  TypeScript の case は 部品 next と angular の両方で、Dart の case は 部品 flutter で 確かめる。

cases:
  - id: TC-OUT-CLOCK-MOCK
    requirement: REQ-OUT-MOCK
    behavior: mock の Clock は 決めた時刻を返し Advance した分だけ進む。Sleep は 実時間を待たない。
    input: 開始の時刻・Advance の長さ・Sleep の長さ
    mocks: なし (mock そのものが対象)
    expect: Now の値が 入力から計算した値に一致する。test の所要は 実時間に依らない。

  - id: TC-OUT-CLOCK-TIMER
    requirement: REQ-OUT-CONTRACT
    behavior: Timer・Ticker・After は 期限が来たら channel に時刻を送る。Stop した物は送らない。Reset は期限を掛け直す。mock は Advance・Sleep で発火し 実時間を待たない。
    input: 期限の違う Timer 2 つ・Ticker・After と Advance の長さ / Stop と Reset
    mocks: なし (real は 短い期限で 自分で掛けた物だけ / mock は そのもの)
    expect: 期限を過ぎた物だけが 期限の時刻を送る (mock は 期限の時刻と一致)。Stop の戻りは 止めた時 true・済んでいた時 false。Ticker は 過ぎた回数だけ発火を試み buffer 1 を超えた分は落ちる。

  - id: TC-OUT-FS-MORE
    requirement: REQ-OUT-CONTRACT
    behavior: Open・AppendFile・MkdirAll・Lstat・Rename・RemoveAll が real と mock で同じ振る舞いをする。
    input: 書いた file を Open で読む / AppendFile 2 回 / MkdirAll の入れ子 / Rename (根の中・根の外) / RemoveAll (dir・無い path・根) / Lstat (real は symlink を自分で作る)
    expect: Open で書いた中身が読める・無い path は fs.ErrNotExist。AppendFile は 足した順に並ぶ。Rename の根の外は 誤り。RemoveAll は 中身ごと消え 無い path は 誤りでなく 根は 誤り。Lstat は symlink を IsSymlink で名乗る (mock の FS の symlink は TC-OUT-FS-SYMLINK で作る)。

  - id: TC-OUT-FS-PERM
    requirement: REQ-OUT-CONTRACT
    behavior: NewFS の FS が作る file は 0644・dir は 0755、NewPrivateFS の FS が作る file は 0600・dir は 0700。Stat の Mode で読める。既に在る file への書き込みは 権限を変えない。
    input: 両方の FS で WriteFile (親の dir も作る)・AppendFile (無い file と 在る file)・MkdirAll / 既定の FS で作った file を private の FS で WriteFile
    mocks: real は test が作った dir だけを根にし umask の影響を受けない形で確かめる (作った後に Stat の Mode を見る)
    expect: real と mock で 同じ Mode。private の FS で作った物は 他の user の bit が 0。

  - id: TC-OUT-FS-READONLY
    requirement: REQ-OUT-CONTRACT
    behavior: NewReadOnlyFS の FS が作る file は 0444・dir は 0755。その file への 2 度目の WriteFile・AppendFile は fs.ErrPermission で 中身は変わらない。既定の FS から書いても 同じ誤り。Remove は できる。
    input: 新しい file の WriteFile (親の dir も) / 同じ file への WriteFile・AppendFile / 既定の FS からの WriteFile / Remove
    mocks: real は test が作った dir だけを根にする (root の user で走る時は OS が権限を見ないので 上書きの確かめを飛ばし 飛ばした事を名乗る)
    expect: real と mock で 同じ Mode・同じ誤り・中身が最初に書いた物のまま。

  - id: TC-OUT-FS-SYMLINK
    requirement: REQ-OUT-CONTRACT
    behavior: Symlink・Readlink が real と mock で同じ振る舞いをする。
    input: >
      根の中の file を指す link を作る / 同じ link を別の target へ貼り替える / link が file・dir / 親の dir が無い /
      根の外を指す target (../x と 絶対 path) / symlink でない path の Readlink / link 越しの ReadFile・Stat
    expect: >
      Lstat は IsSymlink。Readlink は 最後に貼った target。貼り替えの後 link 越しに 新しい中身が読める。link が file・dir と 親が無い は 誤り。
      根の外を指す link は 作れ Readlink は target を返すが 辿る ReadFile は 誤り。symlink でない path の Readlink は 誤り。

  - id: TC-OUT-PROC-KILLGROUP
    requirement: REQ-OUT-CONTRACT
    behavior: KillGroup の子は ctx の終わりで 孫まで止まり Result.Killed = true。自分で終えた子は Killed = false。
    input: real = test が作った helper が 孫を起こして待つ・ctx を短い期限で切る / KillGrace の短い値 / SIGTERM を無視する helper / 自分で終える helper。mock = ctx を受ける関数と 取り消した ctx
    expect: >
      real: Run は ctx の誤りを包み Killed = true。孫の pid に signal 0 が届かない (止まっている)。SIGTERM を無視する子も KillGrace の後に止まる。自分で終えた子は Killed = false で誤り無し。
      mock: Killed = true と ctx の誤り。Cmds() に KillGroup・KillGrace が残る。

  - id: TC-OUT-PROC-UNSET
    requirement: REQ-OUT-CONTRACT
    behavior: Cmd.Unset の名は 親の環境変数に在っても 子へ渡らない。Env で同じ名を足せば Env の値が渡る。mock は Unset を記録し 親の環境変数を読まない。
    input: real = test が自分で設けた環境変数 (t.Setenv) と それを出力する helper / Unset なし・Unset あり・Unset と Env に同じ名。mock = Unset を持つ Cmd
    expect: real は 渡る・渡らない・Env の値 の順。mock の Cmds() の Unset が 渡した物と一致する。

  - id: TC-OUT-PROC-LOOKPATH
    requirement: REQ-OUT-TOOL-ENV
    behavior: LookPath は 宣言した program の path を返し 宣言に無い名前は ErrUndeclaredProgram。
    input: 宣言の programs・引く名前 (real は test が作った実行 file を path で宣言)
    expect: 宣言に在る名前は path。無い名前は ErrUndeclaredProgram。mock は 渡した path。

  - id: TC-OUT-ENV-MOCK
    requirement: REQ-OUT-MOCK
    behavior: mock の Env は 渡した表の値だけを返す。
    input: 表・引く名前
    expect: 表に在る名前は値、無い名前は 無い。機体の環境変数は 結果に現れない。

  - id: TC-OUT-FS-ROOT
    requirement: REQ-OUT-ONLY
    behavior: FS は 宣言した根の外の path を 誤りで返す。
    input: 根・根の中の path・根の外へ出る path (.. と 絶対 path)
    mocks: mock の FS
    expect: 根の中は読める。外へ出る path は 誤り (読まない)。

  - id: TC-OUT-SYSINFO-MOCK
    requirement: REQ-OUT-MOCK
    behavior: mock の SysInfo は 渡した値だけを返す。渡していない Hostname・HomeDir・ConfigDir・CacheDir・Getwd は 誤り。
    input: host の名前・home の dir・process の番号・端末か の値 / 何も渡さない mock
    expect: 返る値が入力に一致する。何も渡さない mock の Hostname・HomeDir・ConfigDir・CacheDir・Getwd は 誤り、Pid・Ppid は 0、IsTTY は false。機体の値は 結果に現れない。

  - id: TC-OUT-IDGEN-MOCK
    requirement: REQ-OUT-MOCK
    behavior: mock の IdGen は id-0001 から 呼んだ順に決まった ID を返す。mock ごとに 1 から始まる。
    input: 2 つの mock・それぞれで NewID (newId) を呼ぶ回数
    expect: 1 つ目の mock は id-0001・id-0002・id-0003。2 つ目の mock は id-0001 から始まる。

  - id: TC-OUT-RANDOM-MOCK
    requirement: REQ-OUT-MOCK
    behavior: mock の Random は 種と呼び順だけで byte 列が決まり 読んだ長さを記録し WithErr の後は 誤りを返す。
    input: 同じ種の 2 つの mock に同じ長さの順で Read / 違う種 / 1 回で 64 byte と 32 byte を 2 回 / WithErr
    expect: 同じ種は同じ byte。違う種は違う byte。分けて読んでも 続けて読んでも 同じ列。記録は 読んだ長さの順。WithErr の後は n=0 と その誤り。

  - id: TC-OUT-RANDOM-FE
    requirement: REQ-OUT-CONTRACT
    behavior: next・angular・flutter の Random は real と mock で 渡した byte 列を全部埋め、mock は 種と呼び順だけで決まり 長さを記録し withErr の後は投げる。
    input: 16 byte と 8 byte の read を続けて / 同じ種の 2 つの mock / 違う種 / 24 byte を 1 回と 16+8 / withErr
    expect: 全部埋まる (real は 続けて読んだ 16 byte が互いに違う)。同じ種は同じ byte、違う種は違う byte、分けても同じ列。記録は 長さの順。withErr の後は その誤りを投げる。

  - id: TC-OUT-NEXT-FS
    requirement: REQ-OUT-CONTRACT
    behavior: next の FS は real と mock で 同じ契約を通す。
    input: 書いた file を読む (Uint8Array と string) / 親の無い path への writeFile / readDir の順 / stat (file と dir) / 無い path / 根の外 (../x と 絶対 path) / remove (file・空の dir・中身の在る dir・根) / mkdirAll の入れ子 / mock の tree の宣言 (空の dir・根の外の宣言)
    mocks: real は test が作った dir だけを根にする
    expect: 読めた中身が書いた物と一致。無い path は code ENOENT。根の外は 誤り。中身の在る dir の remove と 根の remove は 誤り。real と mock で 同じ結果。

  - id: TC-OUT-NEXT-PROC
    requirement: REQ-OUT-CONTRACT
    behavior: next の Proc は 宣言した program を起こし exitCode・stdout・stderr を返し stdin・env・unset を子へ渡す。宣言に無い名前は 誤り。
    input: real = test が作った script (node で動く) を path で宣言 / echo・exit 3・stdin の cat・env の出力・unset / 宣言に無い名前 / signal の abort。mock = 結果を決める関数
    expect: real と mock で 同じ結果。0 以外の exit は 結果。宣言に無い名前は reject。mock の calls に stdin・env・unset が残る。

  - id: TC-OUT-NO-TOOL-NAME
    requirement: REQ-OUT-NO-TOOL-NAME
    behavior: Go の部品は 特定のツールの名前の口を持たず git の program を起こさない (requires_git_worktree は .git を探して確かめる)。
    input: go の部品の公開の名前の一覧・.git を持つ dir と持たない dir (test が作る) の宣言
    expect: 公開の名前に Git が無い。.git が在る木では 合格、無い木では git の木が足りないと名乗る。PATH に git が無くても 結果が同じ。

  - id: TC-OUT-RUNTIME-DEPS
    requirement: REQ-OUT-RUNTIME-DEPS
    behavior: 部品の依存の宣言が runtime の標準の外を持たない。
    input: go/go.mod・next/package.json・angular/package.json・flutter/pubspec.yaml の dependencies と source の import
    expect: go は 標準と BurntSushi/toml だけ。next は dependencies が空で import は node:* と 相対だけ。angular は dependencies が空で import は 相対だけ。flutter は dependencies が空で import は dart:* と package:outside だけ。

  - id: TC-OUT-PROC-DECLARED
    requirement: REQ-OUT-TOOL-ENV
    behavior: Proc は 宣言に無い program を起こさず 誤りで返す。
    input: 宣言の programs・起こす名前
    mocks: mock の Proc
    expect: 宣言に在る名前は 記録されて結果が返る。無い名前は 誤り。

  - id: TC-OUT-WORKDIR-DECLARED
    requirement: REQ-OUT-WORKDIR
    behavior: Workdir は 宣言した置き場の下にだけ作る。置き場が無ければ 誤り。
    input: 置き場が在る宣言・置き場が無い宣言
    expect: 作られた path は 置き場の下。置き場が無い時は 誤りで system の一時置き場に作らない。

  - id: TC-OUT-WORKDIR-REPO-ENSURE
    requirement: REQ-OUT-WORKDIR
    behavior: 置き場が repo の中の相対 path で 在らなければ 作って 処理を呼ぶ。$NAME が指す置き場が在らなければ 作らず 判定不能。
    input: 宣言 workdir_root = ".work/tool" (在らない) / workdir_root = "$NAME" (指す先が在らない)
    mocks: real は test が作った dir の下 / mock は outsidemock の Workdir
    expect: 前者は 置き場が出来 作業場は その直下 処理は 1 回。後者は 処理を呼ばず exit 3。

  - id: TC-OUT-RUNTOOL-MISSING
    requirement: REQ-OUT-TOOL-ENV
    behavior: RunTool は 宣言に合わない環境で 足りない物を名乗って終わり 処理を呼ばない。
    input: 宣言 (git の木が要る・program X の版 n が要る・置き場 $NAME/<相対> が外へ出る) と それを満たさない環境 (mock)
    expect: 処理は 1 度も呼ばれない。誤りの文に 足りない物の名前が在る。exit の番号は 3 (判定不能)。

  - id: TC-OUT-RUNTOOL-OK
    requirement: REQ-OUT-TOOL-ENV
    behavior: RunTool は 宣言に合う環境で set を渡して処理を呼ぶ。
    input: 宣言と それを満たす環境 (mock)
    expect: 処理が 1 回呼ばれ 渡された set の port が 宣言の範囲に限られている。

  - id: TC-OUT-SECRET-NOCOPY
    requirement: REQ-OUT-SECRET
    behavior: secret を読む口は 値を返すだけで 作業場に file を作らない。
    input: secret の名前
    mocks: mock の FS・ mock の Workdir
    expect: 値が返る。FS と Workdir に 書き込みが記録されない。

  - id: TC-OUT-CONTRACT
    requirement: REQ-OUT-CONTRACT
    behavior: 口ごとの契約の test を real と mock の両方に掛け 両方が通る。
    input: 口ごとの契約 (例 Clock = Now は戻らない / FS = 書いた中身が読める・根の外は誤り / Env = 無い名前は 無い /
      SysInfo = Hostname・HomeDir・ConfigDir・CacheDir・Getwd は 空でない値か 誤り・Pid は 正の数・Ppid は 0 以上 (mock は 渡した値) /
      IdGen = 続けて呼んだ ID は 互いに違い 空でない /
      Random = Read は p を全部埋め n=len(p)・誤り無し、続けて読んだ 32 byte は 互いに違う /
      Proc = Stdin が子 process の標準入力に届き 無ければ空 /
      Workdir = 作った作業場の FS に書けて読め 根の外は誤り・作っていない作業場の FS は誤り)
    note: real に掛ける時は test が自分で作った物 (自分で作った dir・自分で起こした子 process) だけを触る。
    expect: 同じ契約の test が real でも mock でも通る。片方だけ落ちる項目は 名前を出して 誤り。

  - id: TC-OUT-IOFS
    requirement: REQ-OUT-INJECT
    behavior: IOFS は FS を io/fs の決まり (fstest.TestFS) どおりに読ませる。
    input: mock の FS (file 3 つと 入れ子の dir)
    expect: fstest.TestFS が通る。

  - id: TC-OUT-LINT-GO
    requirement: REQ-OUT-LINT
    behavior: lint の設定は 外を直に呼ぶ code (時計・環境変数・機体と process の値 (Hostname・Getpid・UserHomeDir 等)・乱数 (math/rand・math/rand/v2・crypto/rand)・子 process・file) を落とし 口を通す code を通す。
    input: lint-go/testdata/bad (禁じた呼び出しの種類ごとに 1 つ以上) と testdata/good (口を受け取る code)
    expect: bad は 禁じた呼び出しが 全部 名指される (種類ごとに 期待の行と一致)。good は 誤り 0。

  - id: TC-OUT-LINT-TS
    requirement: REQ-OUT-LINT
    behavior: TypeScript の lint の設定は 外を直に呼ぶ code (Date.now・引数なしの new Date・setTimeout・setInterval・process.env・fetch・localStorage・sessionStorage・window/globalThis 越しの同じ物・fs と child_process の import) を落とし 口を通す code と 決めた時刻の Date を通す。
    input: lint-ts/testdata/bad (禁じた呼び出し 11 個) と testdata/good (口を受け取る code)
    expect: bad は 11 個とも誤り。good は 誤り 0。

  - id: TC-OUT-LINT-DART
    requirement: REQ-OUT-LINT
    behavior: Dart の lint は 外を直に呼ぶ code を行ごとに名指し 口を通す code と 決めた時刻の DateTime を通す。読めない source は 判定不能。
    input: lint-dart/testdata/bad (禁じた呼び出し 8 個) と testdata/good と 構文の誤った source
    expect: bad は 8 個とも 行と名前で名指される (CLI は exit 1)。good は 0 件 (exit 0)。読めない source は 例外 (CLI は exit 3)。

  - id: TC-OUT-PARITY
    requirement: REQ-OUT-PARITY
    behavior: 各部品の port と method の名前の組が 設計書の ports の節と一致する (go = backend_and_tools、next・angular・flutter = frontend_and_mobile)。
    input: 設計書の ports の節・各部品の公開の名前の一覧
    expect: 4 つの部品とも 設計書と同じ組。食い違いは 名前を出して 誤り。

  - id: TC-OUT-LINT-PLATFORM
    requirement: REQ-OUT-PLATFORM-LAYOUT
    behavior: >
      直下の項目の表 (名前・dir か・lib の中の file の相対 path) を値で渡し 規則の 3 つの違反を名指す。
      lib の中の sub dir と 3 file 以外の file は 名指さない。同じ runtime で同じ依存先が 2 つの機能に在れば 警告に出す。
    input: >
      規則どおりの Go (直下)・TS (src/ の下)・Dart (lib/ の下) の lib / 表に無い機能の語 / runtime の無い名前 /
      何の依存先か分からない名前 / mock の無い lib / 直下の file / 3 file と別の sub dir と設定の file を持つ lib /
      db-postgres-go と kv-postgres-go の並び
    mocks: なし (disk を読まない純粋関数)
    expect: 規則どおりと sub dir・設定の file を持つ lib は 違反 0。他は 名前と理由で名指す。並びは 警告 1 件で 違反 0。

  - id: TC-OUT-LINT-PLATFORM-TABLE
    requirement: REQ-OUT-PLATFORM-LAYOUT
    behavior: 規則の表 (機能の語 × runtime) の全ての組が 名前の形として通る (表と形の食い違いを捕る陽性対照)。
    input: rules.go の表
    expect: 全ての組が通る。runtime ごとの必須の file は 3 個。中身を表さない語は 共通の表に無い。

  - id: TC-OUT-LINT-PLATFORM-VOCAB
    requirement: REQ-OUT-PLATFORM-LAYOUT
    behavior: project の宣言の語は 共通の語と同じく通る。宣言に無い語は 違反。中身を表さない語の宣言は 判定不能 (exit 3)。
    input: outside-platform.toml の capabilities = ["pay"] と pay-stripe-go / sms-twilio-go の lib。宣言 ["util"]。
    expect: pay-stripe-go は通る。sms-twilio-go は 違反。util の宣言は 語を名指して exit 3。

  - id: TC-OUT-LINT-PLATFORM-SCAFFOLD
    requirement: REQ-OUT-PLATFORM-LAYOUT
    behavior: scaffold は 規則どおりの名前なら dir と 3 file を作り 作った物は 検査に通る。規則に合わない名前なら 何も作らない。
    input: 空の根に scaffold db postgres go と scaffold misc x go
    mocks: test が作った 空の dir
    expect: 前者は 3 file が出来 検査が違反 0。後者は 何も作らず 誤り。

  - id: TC-OUT-LINT-PLATFORM-TESTS
    requirement: REQ-OUT-INTEGRATION-PLACE
    behavior: >
      tests は libs/platform/** と adapter_dirs の外に integration の印を持つ test か 本物の口を作る物を使う test が在れば 名指して落とす。
      印も本物の口も無い test と 置き場の中の物は 通す。
    input: >
      test が作る repo の木 = libs/platform/db-postgres-go/x_test.go (//go:build integration) / tools/dbgate/db_test.go (//go:build integration) /
      tools/dbgate/unit_test.go (印なし) / apps/web/a.integration.spec.ts / libs/platform/http-fetch-next/src/b.integration.spec.ts /
      apps/mobile/test/c_test.dart (@Tags(['integration'])) / tools/legacy/d_test.go (//go:build integration && linux) と adapter_dirs = ["tools/legacy"] /
      node_modules・libs/outside の下の 印つき file / adapter_dirs = ["."] か ["../x"] の宣言。
      本物の口 = 印なしで outside.NewProc を呼ぶ tools/x/a_test.go (別名の import も) / createRealSet を別名で import する apps/web/b.spec.ts /
      package:outside を import して RealHttp( を呼ぶ apps/mobile/test/c2_test.dart / libs/platform/db-postgres-go の adapter_real.go の Real を使う tools/y/d_test.go /
      ./real を import する apps/web/e.spec.ts / mock だけを使う test (outsidemock・createMockSet・MockHttp・adapter_mock) /
      置き場の中で本物を使う test
    expect: >
      印の 3 件 (tools/dbgate/db_test.go・apps/web/a.integration.spec.ts・apps/mobile/test/c_test.dart) を runtime と共に名指し
      本物の口の 5 件 (tools/x/a_test.go・apps/web/b.spec.ts・apps/mobile/test/c2_test.dart・tools/y/d_test.go・apps/web/e.spec.ts) を 行と名前と共に名指し exit 1。
      印なし・libs/platform の下・宣言の dir の下・node_modules と libs/outside の下・mock だけの test・置き場の中の本物は 名指さない。
      . と 根の外の宣言は exit 3。

  - id: TC-OUT-SYNC
    requirement: REQ-OUT-VENDOR
    behavior: >
      sync-outside.sh は 渡した部品の tag から その部品の path だけを取り出し place を丸ごと置き換え .outside-version に tag を書く。
      他の部品の tag・形の違う tag・在らない tag は 何も書かずに誤りで終わる。
    input: test が作った bare repo (2 つの部品と それぞれの tag) と 取り込み先の作業木 (place に古い写しと余分な file)
    mocks: 取得元は test が作った bare repo (網を使わない)
    replace_failure: 置き場の親に書けない時と 新しい写しを入れる mv だけが失敗する時 (失敗する mv を PATH の先頭に置く) は 前の写しが 1 byte も変わらず 戻した事を名乗る。
    expect: place の中身が tag の中身 (部品の test を除く) と一致し 余分な file が消え .outside-version が tag。部品の test (*_test.go・testdata/・*.test.js・*_test.dart・test/) は写らず test でない file は写る。誤りの時は 取り込み先が 1 byte も変わらない。

  - id: TC-OUT-SYNC-CHECK
    requirement: REQ-OUT-VENDOR-INTACT
    behavior: >
      sync-outside.sh は .outside-version に 1 行目 tag・2 行目 全体の指紋・file ごとの指紋を書く。--check <部品> は 網に行かず 置き場を数え直して照らす。
    input: >
      取り込んだ直後の置き場 / 1 file の中身を変えた置き場 / file を足した置き場 / file を消した置き場 /
      file ごとの行を書き換えた .outside-version / 指紋の行が無い .outside-version (tag だけ) / 置き場が無い
    mocks: 取得元は test が作った bare repo。--check の間は 取得元を消して 網に行かない事を確かめる。
    expect: >
      直後は exit 0。中身を変えた・足した・消した は exit 1 で その path と 違う・増えた・消えた を名指す。行の書き換えは exit 1。
      指紋の行が無い・置き場が無い は exit 3 (判定不能)。1 行目は tag のまま (head -1 で版が引ける)。

  - id: TC-OUT-RELEASE
    requirement: REQ-OUT-COMPONENT
    behavior: release.sh <部品> <段> は その部品の最新の tag から次の版を決め 他の部品の tag に影響されない。
    input: test が作った repo (go/v0.6.0・lint-platform/v0.1.0 の tag)
    expect: lint-platform minor → lint-platform/v0.2.0。go patch → go/v0.6.1。tag の無い部品 → <部品>/v0.1.0。


id: DSG-outside-001
title: outside — 外を触る口の共通部品
status: draft
owner: aimglow
repo: github.com/aimglow/outside

purpose: >
  application とツールが 外 (時計・環境変数・file・git・子 process・作業場・通信・保存) を触る場所を
  この部品 1 つに限る。処理の中身は 値を受けて値を返す形になり、test は 口に mock を渡すだけで
  結果が決まる。機体が変わっても・日付が変わっても 同じ入力なら同じ結果になる。

scope:
  in:
    - 全 project (ccark / amatelas / kifune / daikokuten / demaetei) の BE・ツール・FE・mobile
    - Go の module、TypeScript の library (Nx・Next.js・Angular)、Dart の package (Flutter。iOS と Android の両方に対応する UI を作るのが目的)
    - 各 stack の lint の設定 (外を直に呼ぶ code を build で落とす)
  out:
    - Flutter の web (作らない。web は Angular で作る。Dart の package は web の build に対応しない)
    - 目的に対して手段が妥当かの判断 (設計の review が持つ。lint では判定しない)
    - project 固有の業務の処理

terms:
  outside: 処理の入力として宣言されていない物。時計・環境変数・file system・git・子 process・機体の値・通信・browser の保存。
  port: outside を触るための口。1 種類の外につき 1 つ。
  real: port の本物の実装。この部品の中だけに在る。
  mock: port の test 用の実装。渡した値だけで振る舞いが決まる。
  set: 1 つの処理に渡す port の組。
  tool-environment: ツールが動く前提として宣言する環境 (要るツールと版・git の木の中か・作業場)。

requirements:
  - id: REQ-OUT-ONLY
    text: 外を直に呼んでよいのは この部品の real だけ。project の code は port を通す。
    check: lint (REQ-OUT-LINT)。
  - id: REQ-OUT-INJECT
    text: 処理は 自分が使う port を 引数か構造体で受け取る。package の変数や global から取らない。
  - id: REQ-OUT-MOCK
    text: >
      mock は 渡した値だけで振る舞いが決まる。実の時計・機体・file system を読まない。
      mock が呼ばれた内容 (何を・何回) は test から読める。
  - id: REQ-OUT-ONE-MOCK
    text: 口 1 つにつき mock は 1 つ。この repo が持つ。利用する project は 自分で mock を作らない。
  - id: REQ-OUT-CONTRACT
    text: >
      real と mock は 同じ契約の test を通す (同じ入力に 同じ振る舞い)。
      片方だけが通る振る舞いを残さない。
  - id: REQ-OUT-REAL-TESTED-HERE
    text: >
      real を実物で確かめる test は この repo の中だけに置く。その test は 自分で作った物だけを触り
      機体に元から在る物を読まない。利用する project の test は 実物を触らず mock を渡す。
  - id: REQ-OUT-MOCK-TREE
    text: >
      mock の FS に渡す dir の木は test の側が 値として宣言する (相対 path → 中身 の表。
      空の dir は 末尾 / の path で書く)。disk に木を作らない。絶対 path と 根の外へ出る path の宣言は 誤り。
      複数の test が使う木は test の code の中の 名前つきの値として置く。
      大きい中身は 言語の埋め込み (Go の embed 等) で package の source として持ち test の時に disk を探さない。
      宣言の形は Go・TypeScript・Dart で同じ。 mock の Git の 追跡下の一覧と差分も 同じく値で宣言する。
  - id: REQ-OUT-TOOL-ENV
    text: >
      ツールは 入口で tool-environment の宣言を確かめる。宣言に合わない環境では
      何が足りないかを名乗って 誤りで終わる。宣言の外で 別の動きをしない。
  - id: REQ-OUT-WORKDIR
    text: >
      作業場は 宣言した置き場の下に作る。system の一時置き場 (/tmp・os.TempDir・MkdirTemp(""))
      を使わない。置き場が repo の中の相対 path なら 無ければ作る (checkout の中ゆえ どの機体でも 新しい clone でも 同じ形で成り立つ)。
      置き場が $NAME (環境変数) で指す物なら 機体が用意する物ゆえ 無ければ作らず 誤りで終わる (知らない場所に dir を作らない)。
  - id: REQ-OUT-NO-ABSPATH
    text: repo の外の絶対 path を code と test に書かない。置き場は tool-environment の宣言から受け取る。
  - id: REQ-OUT-SECRET
    text: secret の値を 作業場へ複製しない。secret を読む口は 値を返すだけで 置き場を作らない。
  - id: REQ-OUT-PARITY
    text: port の名前と意味は Go・TypeScript・Dart で同じ。この設計書の ports の節が唯一の定義。
  - id: REQ-OUT-COMPONENT
    text: >
      版は 部品 (components の表の 1 行) ごとに独立に出す。project は 部品ごとに 版を選んで取り込む
      (lint だけ上げて 口は据え置く・go だけ上げて flutter は据え置く が できる)。
  - id: REQ-OUT-VENDOR
    text: >
      project は 部品を 版の tag から git archive で取り出し 自分の repo の中の 決まった置き場へ置く
      (components の表の place)。検査や build のたびに 網から取らない。置いた写しは project の中で編集しない。
      どの部品の どの版を置いたかは 置き場の .outside-version に書く。
  - id: REQ-OUT-VERSION-VISIBLE
    text: 各 project が どの部品の どの版を置いているかを .outside-version から名指せる。project の間の版の違いは 名指すが 止めない。
  - id: REQ-OUT-PLATFORM-LAYOUT
    text: >
      adapters 層 (各 project の libs/platform) が 外の依存先ごとの lib の並びのまま保たれる事を 検査で強制する。
      検査が決めるのは lint.platform の rules の 3 つだけ。lib の中の形 (sub dir・3 file 以外の file・設定の file) は
      言語とツールの慣習に任せ 設計の review で見る。
  - id: REQ-OUT-LINT
    text: >
      各 stack の lint の設定を この repo が持ち、project は それを取り込む。
      禁じる呼び出しは lint の節の一覧。部品の real の中だけ 例外。

ports:
  backend_and_tools:
    - name: Clock
      does: 今の時刻を返す。待つ。
      methods: [Now, Sleep]
      mock: 決めた時刻から始まり Advance で進む。Sleep は 実時間を待たず 時刻を進める。
    - name: Env
      does: 環境変数を名前で読む。
      methods: [Lookup]
      mock: 渡した表だけを返す。表に無い名前は 無い と返す。
    - name: FS
      does: 宣言した根の下の file を読む・書く・一覧する。
      methods: [ReadFile, WriteFile, ReadDir, Stat, Remove]
      rule: 根の外の path は 誤り。IOFS(FS) は io/fs.FS として読ませる (io/fs を受ける値の関数へ渡す)。
      mock: memory の上の木。
    - name: Git
      does: 宣言した木の git の問いに答える (head の sha・追跡下の一覧・merge-base・差分の file・ref の sha・ある rev の木の一覧と中身)。
      methods: [Head, ListFiles, MergeBase, DiffNames, IsAncestor, Resolve, ListAt, ReadAt]
      rule: ListAt は 無い dir に 空を返す。ReadAt は 無い path に fs.ErrNotExist を返す。根の外の path は 誤り。
      mock: 渡した値を返す。実の repo を作らない。
    - name: Proc
      does: 宣言した名前の program を起こし 結果を返す。
      methods: [Run]
      rule: tool-environment に無い program は 誤り。Cmd の Stdin は 子 process の標準入力に渡す (秘密を disk にも argv にも載せずに渡す)。
      mock: 起こされた Cmd (引数・Stdin・Env・Dir) を記録し 決めた結果を返す。
    - name: Workdir
      does: 宣言した置き場の下に 作業場を作り 終わりに消す。作った作業場を根にした FS を返す。
      methods: [New, Path, Cleanup, FS]
      rule: FS は この口が作った作業場にだけ返す。
      mock: memory の上の木。FS も memory の上。
  frontend_and_mobile:
    - name: Clock
      does: 今の時刻を返す。timer を掛ける。
      methods: [now, setTimeout, clearTimeout]
      mock: 決めた時刻から始まり advance で進む。
    - name: Http
      does: 通信を送り 応答を返す。
      methods: [request]
      mock: 決めた応答を返し 送られた内容を記録する。
    - name: Storage
      does: browser か端末の保存を読む・書く。
      methods: [get, set, remove]
      mock: memory の上の表。test ごとに空から始まる。
    - name: Config
      does: build 時と実行時の設定の値を返す。
      methods: [get]
      mock: 渡した表だけを返す。

tool_entry:
  name: RunTool
  does:
    - tool-environment の宣言を読む
    - 宣言を確かめる (要る program と版・git の木の中か・作業場の置き場)
    - 合わなければ 足りない物を名乗って 誤りで終わる
  exit: 0 = 合格 / 1 = 不合格 / 3 = 判定不能 (宣言に合わない環境・宣言が読めない)
    - 合えば set (real) を作って 処理へ渡す
  declaration:
    format: TOML
    file: outside.toml (ツールの dir)
    fields:
      requires_git_worktree: bool
      programs: 名前と版の表
      workdir_root: 作業場の置き場 (repo の中の相対 path か $NAME か $NAME/<相対 path>。相対 path は 外へ出ない)
      env: 読んでよい環境変数の名前の一覧
      fs_roots: 読み書きしてよい根の一覧 (repo の中の相対 path)

lint:
  platform:
    purpose: adapters 層 (libs/platform) の直下を 外の依存先ごとの lib の並びに保ち ごみ置き場にしない。
    rules:
      - 直下の dir 名は <機能>-<依存先>-<runtime>。runtime の語と 全 project 共通の機能の語は lint-platform/naming/rules.go の表 (規則の正本)。
        project 固有の機能の語は その project の repo の根の outside-platform.toml の capabilities = [...] に書く (名前と場所は固定。outside.toml はツールの環境の宣言の名前なので使わない。道具は --vocab で この file を受け取り 無ければ 共通の語だけで検査する)。
        中身を表さない語 (common・util・shared・helper・misc・lib・core・base・other) は 共通の表にも 宣言にも 置けない (道具が拒む)。
      - 直下に dir 以外の物を置かない。
      - 各 lib は runtime ごとの 3 file (interface / real / mock) を 直下か src/ か lib/ に持つ。
    not_checked:
      - lib の中の sub dir・3 file 以外の file・設定の file (言語とツールの慣習に任せる)
      - 1 lib が 1 つの依存先だけを扱っているか (機械で判定できない。lib を足す変更の 設計の review で見る)
      - mock・interface が 外を直に呼ばないか (lint-go・lint-ts・lint-dart の禁止の一覧が持つ)
    warn: 同じ runtime で 同じ依存先が 2 つの機能に現れたら 名指す (止めない。正当かは 設計の review で決める)。
    exit: 0 = 違反なし / 1 = 違反あり / 3 = 読めない (判定不能。宣言の file が読めない・中身を表さない語を宣言した も ここ)
    scaffold: >
      同じ道具の scaffold <機能> <依存先> <runtime> が 規則どおりの名前の dir と runtime の 3 file の雛形を作る
      (作る前に 名前を同じ規則で確かめ 通らなければ何も作らない)。lib は scaffold で作る事を既定とし 検査は 後から崩れた物を捕る。
    who_decides:
      runtime の語: outside 門番 (outside の部品と 1 対 1)
      共通の機能の語: outside 門番 (2 つ以上の project が使う語を 共通へ上げる)
      project 固有の機能の語: その project (宣言の file の変更を その project の review で見る)
      1 lib が 1 依存先か: その project の 設計の review
    not_expressible:
      機能の語が無い: project の宣言の file に足す (project の review)。
      runtime が無い: outside の部品を足すのと同じ扱い (門番へ依頼)。
      3 file に分けられない依存先: project の中で例外を作らない。門番へ「何を表したいか」を送り 門番が 規則を足して版を出すか 今の形で表す方法を返す。
    cases:
      # 想定したケース。表に無いケースが出たら ここに足し 規則を直す。
      - 新しい外の依存先 (同じ機能・別の依存先、例 db-mysql-go) → 今の語で表せる
      - 新しい種類の依存先 (決済・メール・object storage・LLM) → project が機能の語を宣言して表す
      - 同じ依存先を 2 つの runtime から使う (authn-cookie-next と authn-cookie-angular) → runtime 違いの 2 lib
      - 同じ依存先を 2 つの機能で使う (db-postgres-go と kv-postgres-go) → 通すが 警告で名指す
      - lib の中に 設定の file・生成された code・sub package が要る → 規則は見ない (言語とツールの慣習)
      - 生成された client で 3 file に分けられない → 門番へ依頼
      - 規則を厳しくした版 → MAJOR で出す。project は 直す準備ができてから lint-platform の版だけを上げる
  go:
    tool: golangci-lint 2.x (forbidigo)
    config: lint-go/golangci.yml (利用する project が取り込む)
    forbid: [time.Now, time.Since, time.Until, time.Sleep, time.After, time.Tick, time.NewTimer, time.NewTicker,
             os.Getenv, os.LookupEnv, os.Environ, os.Setenv, os.Unsetenv, os.Hostname,
             exec.Command, exec.CommandContext, exec.LookPath,
             os.TempDir, os.MkdirTemp, os.CreateTemp,
             os.ReadFile, os.WriteFile, os.Open, os.OpenFile, os.Create, os.ReadDir, os.Stat, os.Lstat,
             os.Remove, os.RemoveAll, os.Mkdir, os.MkdirAll, os.Rename]
    except: この部品の real (利用する project では outside は依存の module なので lint の対象に入らない)
  typescript:
    tool: ESLint (no-restricted-syntax・no-restricted-globals・no-restricted-properties・no-restricted-imports)
    config: lint-ts/eslint.config.js (flat config の配列。project の eslint.config.js が取り込んで足す)
    forbid: [Date.now, "new Date() (引数なし)", setTimeout, setInterval, process.env, fetch,
             localStorage, sessionStorage, "import fs", "import child_process"]
    except: この部品の real の module
  dart:
    tool: lint-dart の outside_lint (package:analyzer の構文木を読む。`dart run outside_lint:check <dir>`。exit 0 = 違反なし / 1 = 違反 / 3 = 読めない file = 判定不能)
    forbid: [DateTime.now, Platform.environment, Process.run・runSync・start, "File(...)", "Directory(...)", Directory.systemTemp, Directory.current, "HttpClient(...)", "Timer(...)"]
    except: この部品の real の library と lint 自身 (対象の dir に渡さない)
    limit: 型を解決しない構文木で読む = 別名の import (import 'dart:io' as io の io.File 等) は名指せない。見つけたら この一覧に足す。

components:
  # name = 版の tag の頭 (<name>/vX.Y.Z) / path = この repo の中の dir / place = 取り込む project の中の置き場
  - {name: go,            path: go/,                         place: libs/outside/go/}
  - {name: next,          path: next/,                       place: libs/outside/next/}
  - {name: angular,       path: angular/,                    place: libs/outside/angular/}
  - {name: flutter,       path: flutter/,                    place: libs/outside/flutter/}
  - {name: lint-go,       path: lint-go/,                    place: libs/outside/lint-go/}
  - {name: lint-ts,       path: lint-ts/,                    place: libs/outside/lint-ts/}
  - {name: lint-dart,     path: lint-dart/,                  place: libs/outside/lint-dart/}
  - {name: lint-platform, path: lint-platform/,              place: libs/outside/lint-platform/}
  - {name: docs,          path: docs/deterministic-testing/, place: docs/deterministic-testing/}
  rule:
    - path と place は 部品の名前から決まる (docs だけ 各 project の docs の中に置く。持ち主の決め = 各 project の docs に入れ CLAUDE.md から必読にする)。
      取り込みの script は この対応を 名前から引き 設定の file を読まない。
    - 部品を足す・名前を変える時は この表と sync-outside.sh の対応を 同じ commit で直す。

versioning:
  scheme: 版は 部品ごとの git の tag <部品>/vMAJOR.MINOR.PATCH。release.sh <部品> <major|minor|patch> が その部品の最新の tag から次を打つ。
  meaning:
    0.x: その部品が どの project の main にも まだ入っていない間。意味を変える・消す変更も MINOR で出す。
    1.0.0: その部品が 最初の project の main に入る時に切る。
  rule (1.0.0 から):
    - 口の method を消す・意味を変える / lint の規則を足して 今まで通っていた code を赤にしうる = MAJOR
    - 口か method を足す / 今まで通っていた code を赤にしない lint の直し = MINOR
    - 振る舞いを変えない直し = PATCH
  old_line: 古い版を使う project へ直しだけを届ける時は その版の tag から branch fix/<部品>-v<MAJOR>.<MINOR> を切り PATCH の tag を打つ。
  consume:
    how: >
      sync-outside.sh <部品> <tag> (project の中に置く script)。一時の bare repo に その tag だけを取り
      (git fetch --depth 1)、git archive で 部品の path を取り出し place を丸ごと置き換え .outside-version を書く。部品の test (*_test.go・testdata/・*.test.*・*.spec.ts・*_test.dart・test/) は写さない (REQ-OUT-REAL-TESTED-HERE = 部品の test は この repo の中だけで回す)。
      GitHub は git archive --remote に応じないので 一時の bare repo を経る (実測 2026-11-24)。
    fetch_from: https://github.com/aimglow/outside.git
    fetch_identity: git から取得するのは ccark-gitops の名義 (seat の検査も image の build (gitops) も 同じ)。
    go: project の go.mod は replace で libs/outside/go を指す (module path は github.com/aimglow/outside/go のまま)。
    lint_platform: 各 project の push の前の検査の 1 段 = go -C libs/outside/lint-platform run . check --root ../../platform --vocab ../../../outside-platform.toml。読む物 = libs/platform/**・libs/outside/lint-platform/**・outside-platform.toml。
    registry: 有料の registry にも 公開の registry にも 登録しない。

delivery:
  flow: main へ直に commit して push する。この repo は CI・便・gate を持たない (持ち主の決め 2026-11-23)。
  consequence: 確かめは commit の前に 手元で回す。壊れた版を tag にしない。

open:
  - sync-outside.sh 自身の版の配り方 (今は 各 project が main から写し CHANGELOG の scripts の項で写し直す)
  - 部品の間に 版の前提 (例 lint-go が go の新しい口の名前を前提にする) が生じたら その時に 前提を宣言する形を決める
  - Go の FS の method の最小の組 (足りない物は MINOR で足す)
